packages:
  - apps/*
  - packages/*
  - runner
  - extension
# .npmrc doesn't apply to pnpm 11.17.0 (pnpm config get engine-strict /
# save-exact returned undefined with it in place) — these are the
# pnpm-workspace.yaml equivalents, which pnpm does read.
engineStrict: true
saveExact: true
allowBuilds:
  # eslint-plugin-import's TypeScript resolver (transitive, via
  # eslint-config-next). Native binary selection postinstall only; no
  # arbitrary code we need to review beyond that. Vetted at pin time.
  unrs-resolver: true
