<script>
// Test-only hook (real-popup.spec.ts, review issue 2's SPA-mismatch
// scenario). Not invoked by this page on its own -- a real client-side
// router calls history.pushState on a route change, at some arbitrary
// point relative to whatever else is happening in the tab; this fixture
// exposes that one call as a function so the test can trigger it at a
// specific, controlled moment instead of racing a real router's timing.
//
// The busy-wait is the actual reproduction mechanism, not a delay for its
// own sake: chrome.tabs.query() is answered entirely by the browser
// process from its own cached tab state, so it is unaffected by this
// tab's renderer being busy. chrome.scripting.executeScript()'s injected
// function, however, has to run ON this renderer's JS thread -- while
// it's blocked here, the injection is queued, not dropped. Calling this
// function (without awaiting it) immediately before the popup is opened
// guarantees: the popup's chrome.tabs.query() resolves against the OLD
// URL (this tab is busy, hasn't pushState'd yet), and the extractor's
// location.href read -- which can only happen once this busy-wait
// finishes and yields the thread -- sees the NEW URL, because the
// pushState below is this function's last synchronous act before it
// returns. 700ms is a large, deliberate safety margin over the actual
// tabs.query-to-injection gap (typically single-digit milliseconds), not
// a tuned-to-just-barely-pass value.
window.__simulateRouteChangeTo = function (path) {
  var until = Date.now() + 700;
  while (Date.now() < until) {
    /* intentional busy-wait: see comment above */
  }
  history.pushState({}, "", path);
};
</script>
